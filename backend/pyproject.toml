[project]
name = "car-manual-rag-backend"
version = "0.1.0"
description = "Vehicle-specific manual retrieval backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb",
    "fastapi",
    "openai",
    "pydantic-settings",
    "pypdf",
    "pyyaml",
    "rank-bm25",
    "sentence-transformers",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "pytest-mock",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-mock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
