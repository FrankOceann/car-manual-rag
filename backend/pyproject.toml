[project]
name = "car-manual-rag-backend"
version = "0.1.0"
description = "Vehicle-specific manual retrieval backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2,<3",
    "alembic>=1.16,<2",
    "celery[redis]>=5.6,<6",
    "psycopg[binary]>=3.2,<4",
    "PyJWT>=2.10,<3",
    "argon2-cffi>=23",
    "python-multipart>=0.0.20",
    "chromadb",
    "fastapi",
    "openai",
    "pydantic-settings",
    "pypdf",
    "pyyaml",
    "rank-bm25",
    "sentence-transformers",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "pytest-mock",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-mock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
